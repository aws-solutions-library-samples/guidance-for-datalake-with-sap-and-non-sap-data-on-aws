AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Helping customers break down data silos with AWS Integration services

Parameters:
  ConnectionName:
    Description: The name of the SAP source system connection
    Type: String

  AppFlowSAPStartTime:
    Description: EPOCH date of first run for flow
    Type: Number

  DestinationS3BucketName:
    Description: Name of the Destination S3 Bucket = afsaplakeraw-<accountID>
    Type: String

Resources:
  # Purchase Order Account Assignment
  PurchaseOrderAccountAssignmenttoS3:
    Type: AWS::AppFlow::Flow
    Properties:
      FlowName: cds_po_acc_assignment
      FlowStatus: Active
      Description: Pull data from SAP and saves into S3 for C_PURORDACCOUNTASSIGNMENTDEX Purchase Order Account Assignment
      TriggerConfig:
        TriggerType: Scheduled
        TriggerProperties:
          DataPullMode: Incremental
          ## If you wish to extract the transaction data at a different frequency, update here
          ScheduleExpression: rate(5minutes)
          ScheduleStartTime: !Ref AppFlowSAPStartTime
      SourceFlowConfig:
        ConnectorProfileName: !Ref ConnectionName
        ConnectorType: SAPOData
        SourceConnectorProperties:
          SAPOData:
            #  Change this to your ObjectPath
            ObjectPath: /sap/opu/odata/SAP/ZCDS_PO_ACC_ASSIGNMENT_SRV/FactsOfCMMPURORDAADEX
      DestinationFlowConfigList:
        - ConnectorType: S3
          DestinationConnectorProperties:
            S3:
              BucketName: !Ref DestinationS3BucketName
              BucketPrefix: landing
              S3OutputFormatConfig:
                FileType: JSON
                AggregationConfig:
                  aggregationType: None
                PrefixConfig:
                  PrefixFormat: HOUR
                  PrefixType: PATH_AND_FILENAME
      Tasks:
        - TaskType: Map_all
          SourceFields: []
          TaskProperties:
            - Key: EXCLUDE_SOURCE_FIELDS_LIST
              Value: '[]'
          ConnectorOperator:
            SAPOData: NO_OP
